<!DOCTYPE html><html><head><title>Smart Bot</title><style>body{font-family:Arial;background:#0d1117;color:white;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#161b22;padding:20px;border-radius:12px;border:1px solid #30363d}button{padding:15px 30px;font-size:16px;margin:5px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}#start{background:#238636;color:white}#stop{background:#da3633;color:white}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border:1px solid #30363d;padding:8px;text-align:left}.profit{color:#3fb950}.loss{color:#f85149}.buy{color:#3fb950}.sell{color:#f85149}h1,h2{color:#58a6ff}</style></head><body><h1>🤖 Smart Crypto Bot</h1><div class="grid"><div class="card"><h2>Balance: $<span id="balance">0.00</span> USDT</h2><h2>BTC: $<span id="price">0</span></h2><button id="start" onclick="controlBot('start')">START</button><button id="stop" onclick="controlBot('stop')">STOP</button></div><div class="card"><h2>Position</h2><p>Status: <b id="position">WALA</b></p><p>Buy: $<span id="buyPrice">0</span></p><p>P/L: $<span id="currentProfit">0</span></p></div></div><div class="card"><h2>📜 History</h2><table id="historyTable"><tr><th>Time</th><th>Type</th><th>Price</th><th>P/L</th></tr></table></div><script>setInterval(loadData,3000);loadData();async function loadData(){let bal=await fetch('/balance').then(res=>res.json());document.getElementById('balance').innerText=bal.free.toFixed(2);let priceData=await fetch('/price').then(res=>res.json());document.getElementById('price').innerText=priceData.price.toFixed(2);let pos=await fetch('/position').then(res=>res.json());if(pos){document.getElementById('position').innerText='MAY HAWAK';document.getElementById('buyPrice').innerText=pos.buyPrice.toFixed(2);let currentP=priceData.price-pos.buyPrice;document.getElementById('currentProfit').innerText=currentP.toFixed(2);document.getElementById('currentProfit').className=currentP>0?'profit':'loss'}else{document.getElementById('position').innerText='WALA';document.getElementById('buyPrice').innerText='0';document.getElementById('currentProfit').innerText='0'}let history=await fetch('/history').then(res=>res.json());let table=document.getElementById('historyTable');table.innerHTML='<tr><th>Time</th><th>Type</th><th>Price</th><th>P/L</th></tr>';history.slice().reverse().forEach(trade=>{let row=table.insertRow();row.innerHTML=`<td>${trade.time}</td><td class="${trade.type.toLowerCase()}">${trade.type}</td><td>$${trade.price.toFixed(2)}</td><td class="${trade.profit>0?'profit':'loss'}">$${trade.profit}</td>`})};function controlBot(action){fetch('/'+action,{method:'POST'}).then(res=>res.json()).then(data=>alert(data.status))}</script></body></html>
